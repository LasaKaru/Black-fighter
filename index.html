<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BLACKEYE: Ink City — a stylized parkour brawler. Run, fight and fly through a city that watches you back." />
    <meta name="theme-color" content="#111114" />
    <title>BLACKEYE: Ink City</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- non-blocking font load: the game never waits for the network to start -->
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  </head>
  <body>
    <canvas id="game" tabindex="0"></canvas>
    <div id="ui"></div>
    <div id="loading">
      <div>
        <div class="presents" id="presents"><span id="presents-logo"></span><b id="presents-name">HelaO2</b><i id="presents-word">presents</i></div>
        <div class="title-ink">BLACK<span>EYE</span></div>
        <svg class="eye" viewBox="0 0 100 60" xmlns="http://www.w3.org/2000/svg"><path d="M4 30 Q50 -14 96 30 Q50 74 4 30 Z" fill="#f6f5f2" stroke="#eceae6" stroke-width="5"/><circle cx="50" cy="30" r="15" fill="#ff7a1a"/><circle cx="50" cy="30" r="7" fill="#111114"/></svg>
        <p id="loading-text">DRAWING INK CITY…</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
